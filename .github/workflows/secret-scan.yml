name: Secret scan

# Scans the commits a pull request adds, and those a push adds to main, with gitleaks'
# default rules for keys, tokens and other credentials; earlier history is not scanned
# again. Host names, SSH targets and private paths match no gitleaks rule and stay with
# review. GitHub-hosted runner, no secrets, read-only token.
#
# Each commit in the range is scanned on its own, so a later commit that deletes a
# credential does not clear the check: revoke the credential, then rewrite the branch.
# A merge commit is scanned for what it changes beyond git's automatic merge of its
# parents (remerge diff, git 2.36+), such as a conflict resolution; the commits it brings
# in are scanned as their own commits.
#
# .gitleaks.toml extends the default rules with two allowlists: the fake credentials the
# redaction tests write on purpose (scoped to tests/ and to those exact literals), and
# byte-compiled copies of them in a local working tree. A false positive that is not one
# of those is allowed by its fingerprint in .gitleaksignore or a `gitleaks:allow` comment
# on its line.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # git log BASE..HEAD needs both ends and the commits between them
          persist-credentials: false
      # The release binary, not gitleaks-action, which needs a license key in an organization.
      # The checksum is pinned here rather than read from the release it vouches for; change both
      # together.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          name="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$name" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/$name"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$name" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP" gitleaks
      # gitleaks scans nothing, and passes, when the clone lacks a revision of the range, so HEAD
      # must be there. A push's `before` is all zeros when main is created and is not in the clone
      # after a force push; then every commit HEAD reaches is scanned.
      - name: Scan new commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git cat-file -e "$HEAD_SHA^{commit}"
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            range="$BASE_SHA..$HEAD_SHA"
          else
            echo "::notice::Base ${BASE_SHA:-(none)} is not in the clone; scanning all of $HEAD_SHA"
            range="$HEAD_SHA"
          fi
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose \
            --log-opts="--diff-merges=remerge $range" .
